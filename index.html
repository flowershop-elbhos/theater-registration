<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل اختبارات المسرح</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 30px;
        }
        .form-box {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        textarea {
            height: 100px;
            resize: vertical;
        }
        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }
        button:hover {
            background: #444;
        }
    </style>
</head>
<body>
<div class="form-box">
    <h1>تسجيل بيانات اختبارات المسرح</h1>
    <form id="theaterForm">
        <label>الاسم بالكامل</label>
        <input type="text" id="name" required>
        
        <label>السن</label>
        <input type="number" id="age" min="5" max="100" required>
        
        <label>المدرسة</label>
        <input type="text" id="school" required>
        
        <label>المرحلة الدراسية</label>
        <select id="stage" required>
            <option value="">اختر المرحلة</option>
            <option value="ابتدائي">ابتدائي</option>
            <option value="إعدادي">إعدادي</option>
            <option value="ثانوي">ثانوي</option>
        </select>
        
        <label>الصف الدراسي</label>
        <select id="grade" required>
            <option value="">اختر المرحلة أولاً</option>
        </select>
        
        <label>رقم الهاتف</label>
        <input type="tel" id="phone" required>
        
        <label>نوع الاختبار</label>
        <select id="testType" required>
            <option value="">اختر نوع الاختبار</option>
            <option>تمثيل</option>
            <option>استعراض</option>
        </select>
        
        <label>الخبرة السابقة (إن وجدت)</label>
        <textarea id="experience" placeholder="اكتب أي خبرات سابقة في المسرح..."></textarea>
        
        <label>مواهب أخرى (إن وجدت)</label>
        <textarea id="notes"></textarea>
        
        <button type="submit">تسجيل البيانات</button>
    </form>
</div>

<script>
// تحديد الصفوف بناءً على المرحلة
const gradesByStage = {
    "ابتدائي": [
        "الصف الأول",
        "الصف الثاني",
        "الصف الثالث",
        "الصف الرابع",
        "الصف الخامس",
        "الصف السادس"
    ],
    "إعدادي": [
        "الصف الأول",
        "الصف الثاني",
        "الصف الثالث"
    ],
    "ثانوي": [
        "الصف الأول",
        "الصف الثاني",
        "الصف الثالث"
    ]
};

const stageSelect = document.getElementById("stage");
const gradeSelect = document.getElementById("grade");

// تحديث قائمة الصفوف عند تغيير المرحلة
stageSelect.addEventListener("change", function() {
    const selectedStage = this.value;
    
    // تفريغ القائمة الحالية
    gradeSelect.innerHTML = '<option value="">اختر الصف</option>';
    
    if (selectedStage && gradesByStage[selectedStage]) {
        gradesByStage[selectedStage].forEach(function(grade) {
            const option = document.createElement("option");
            option.value = grade;
            option.textContent = grade;
            gradeSelect.appendChild(option);
        });
    } else {
        gradeSelect.innerHTML = '<option value="">اختر المرحلة أولاً</option>';
    }
});

// التعامل مع إرسال النموذج
document.getElementById("theaterForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const name = document.getElementById("name").value;
    const age = document.getElementById("age").value;
    const school = document.getElementById("school").value;
    const stage = document.getElementById("stage").value;
    const grade = document.getElementById("grade").value;
    const phone = document.getElementById("phone").value;
    const testType = document.getElementById("testType").value;
    const experience = document.getElementById("experience").value;
    const notes = document.getElementById("notes").value;

    const message =
        "🎭 تسجيل جديد لاختبارات المسرح\n\n" +
        "الاسم: " + name + "\n" +
        "السن: " + age + "\n" +
        "المدرسة: " + school + "\n" +
        "المرحلة: " + stage + "\n" +
        "الصف: " + grade + "\n" +
        "رقم الهاتف: " + phone + "\n" +
        "نوع الاختبار: " + testType + "\n" +
        "الخبرة السابقة: " + (experience || "لا يوجد") + "\n" +
        "مواهب أخرى: " + (notes || "لا يوجد");

    const whatsappURL =
        "https://wa.me/201103818557?text=" +
        encodeURIComponent(message);

    alert("تم تسجيل البيانات، جاري فتح واتساب...");
    window.location.href = whatsappURL;
});
</script>
</body>
</html>
